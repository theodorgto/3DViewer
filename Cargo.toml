[package]
name = "model-viewer"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Native Windows mesh and STEP model viewer"

[dependencies]
anyhow = "1"
bincode = "1.3"
blake3 = "1"
bytemuck = { version = "1", features = ["derive"] }
earcutr = "0.4"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
glam = { version = "0.30", features = ["serde"] }
gltf = "1.4"
image = { version = "0.25", default-features = false, features = ["png"] }
opencascade = "0.3"
opencascade-sys = "0.3"
ply-rs = "0.1"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stl_io = "0.8"
tobj = "4"
tempfile = "3"

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
glam_cad = { package = "glam", version = "0.24" }

[patch.crates-io]
opencascade-sys = { path = "vendor/opencascade-sys" }

[profile.release]
lto = "thin"
strip = true
